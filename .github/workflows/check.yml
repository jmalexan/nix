name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate every host
        run: nix flake check --no-build --all-systems
      - name: Construct NixOS system derivations
        run: |
          nix eval --raw .#nixosConfigurations.nasa.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.htpc.config.system.build.toplevel.drvPath
      - name: Run Linux repository checks
        run: nix build .#checks.x86_64-linux.lint

  deploy:
    name: Deploy ${{ matrix.host }}
    needs: nix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-${{ matrix.host }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        host: [nasa, htpc]
    steps:
      - uses: actions/checkout@v7

      - name: Join deployment network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # A suspended HTPC cannot answer Tailscale. nasa is its always-on
          # same-LAN Wake-on-LAN relay, so establish that route first.
          ping: ${{ matrix.host == 'htpc' && 'nasa' || matrix.host }}

      - name: Configure deployment SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Wake HTPC and wait for SSH
        id: wake_htpc
        if: matrix.host == 'htpc'
        run: |
          # Do not suspend the machine after deployment if it was already in
          # use. Probe more than once so a momentary connection failure is not
          # mistaken for sleep.
          for attempt in {1..3}; do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 deploy@htpc true; then
              echo "was_asleep=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "was_asleep=true" >> "$GITHUB_OUTPUT"
          ssh -o BatchMode=yes -o ConnectTimeout=15 deploy@nasa wake-htpc

          for attempt in {1..30}; do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 deploy@htpc true; then
              exit 0
            fi
            echo "Waiting for htpc to wake ($attempt/30)..."
            sleep 5
          done

          echo "::error::htpc did not become reachable over SSH after Wake-on-LAN"
          exit 1

      - name: Activate tested revision
        env:
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          # The new host configuration cannot constrain the daemon until it has
          # activated once, so apply nasa's limits to this build explicitly too.
          if [[ "$DEPLOY_HOST" == "nasa" ]]; then
            build_limits="--max-jobs 1 --cores 8"
          else
            build_limits=""
          fi

          ssh -o BatchMode=yes -o ConnectTimeout=15 "deploy@$DEPLOY_HOST" \
            "sudo nixos-rebuild switch $build_limits --refresh --flake 'github:jmalexan/nix/$DEPLOY_REVISION#$DEPLOY_HOST'"

      - name: Return deployment-woken HTPC to sleep
        if: matrix.host == 'htpc' && steps.wake_htpc.outputs.was_asleep == 'true'
        env:
          RESUSPEND_UNIT: github-deploy-resuspend-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 deploy@htpc \
            "sudo systemd-run --unit='$RESUSPEND_UNIT' --on-active=15s --collect /run/current-system/sw/bin/systemctl suspend"
