name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all checks even when verified PR validation exists
        type: boolean
        default: false
      host:
        description: Host to retry or reconcile (main only)
        type: choice
        options: [nasa, htpc, all]
        default: nasa
        required: true

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    env:
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      HEAD_REVISION: ${{ github.sha }}
      FORCE_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.host || '' }}
      CI_FORCE_VALIDATION: ${{ inputs.full_validation || false }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: nix-validation-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      hosts: ${{ steps.plan.outputs.hosts }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find verified PR validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DERIVATIONS_OUTPUT: ${{ runner.temp }}/pr-derivations.json
        run: python3 tools/ci-reuse.py --workflow check.yml
      - uses: cachix/install-nix-action@v31
      - name: Restore Nix check builds
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # Large cache archives take ~100s to create. Keep uploads off validation;
          # the independent main job supplies the shared cache for future PRs.
          save: false
          primary-key: nix-checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Identify derivation cache entries
        id: plan_keys
        run: python3 tools/deployment-plan.py --base "$BASE_REVISION" --head "$HEAD_REVISION" --cache-keys
      - name: Restore base derivations
        if: env.CI_FORCE_VALIDATION != 'true' && steps.plan_keys.outputs.base_key != ''
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/deployment-cache
          key: ${{ steps.plan_keys.outputs.base_key }}
      - name: Validate and plan host deployments
        id: plan
        env:
          REUSED_VALIDATION: ${{ steps.reuse.outputs.reused }}
        run: |
          args=(--base "$BASE_REVISION" --head "$HEAD_REVISION"
                --cache "$RUNNER_TEMP/deployment-cache/derivations.json"
                --verified-head "$RUNNER_TEMP/pr-derivations.json")
          if [[ -n "$FORCE_HOST" ]]; then args+=(--force "$FORCE_HOST"); fi
          if [[ "$REUSED_VALIDATION" != "true" ]]; then args+=(--validate); fi
          python3 tools/deployment-plan.py "${args[@]}"
      - name: Test deployment selection
        if: steps.reuse.outputs.reused != 'true'
        run: python3 -m unittest discover -s tools -p 'test_deployment*.py'
      - name: Run Linux repository checks
        timeout-minutes: 20
        if: steps.reuse.outputs.reused != 'true'
        run: bash tools/ci-checks.sh
      - name: Record tested checkout
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/ci-reuse.py --record "$RUNNER_TEMP/validation.json" \
            --derivations "$RUNNER_TEMP/deployment-cache/derivations.json"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: validated-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          if-no-files-found: error
          retention-days: 14
          archive: true
      - name: Save main derivations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/deployment-cache
          key: ${{ steps.plan_keys.outputs.head_key }}

  warm-check-cache:
    name: Warm PR check cache
    needs: nix
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This is independent of production and never delays activation. PR caches
    # are scoped to their merge ref; build on main to seed future PRs safely.
    concurrency:
      group: nix-check-cache-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Restore and save Nix check builds
        continue-on-error: true
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Build check fixtures for subsequent PRs
        run: bash tools/ci-checks.sh

  deploy:
    name: Deploy ${{ matrix.host }}
    needs: nix
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.nix.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-${{ matrix.host }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.nix.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7

      - name: Join deployment network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # A suspended HTPC cannot answer Tailscale. nasa is its always-on
          # same-LAN Wake-on-LAN relay, so establish that route first.
          ping: ${{ matrix.host == 'htpc' && 'nasa' || matrix.host }}

      - name: Configure deployment SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Wake HTPC and wait for SSH
        id: wake_htpc
        if: matrix.host == 'htpc'
        run: |
          # Do not suspend the machine after deployment if it was already in
          # use. Probe more than once so a momentary connection failure is not
          # mistaken for sleep.
          for attempt in {1..3}; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 deploy@htpc true; then
              echo "was_asleep=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "was_asleep=true" >> "$GITHUB_OUTPUT"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 deploy@nasa wake-htpc

          for attempt in {1..30}; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 deploy@htpc true; then
              exit 0
            fi
            echo "Waiting for htpc to wake ($attempt/30)..."
            sleep 5
          done

          echo "::error::htpc did not become reachable over SSH after Wake-on-LAN"
          exit 1

      - name: Activate tested revision
        env:
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          # The new host configuration cannot constrain the daemon until it has
          # activated once, so apply nasa's limits to this build explicitly too.
          if [[ "$DEPLOY_HOST" == "nasa" ]]; then
            build_limits="--max-jobs 1 --cores 8"
          else
            build_limits=""
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "deploy@$DEPLOY_HOST" \
            "sudo nixos-rebuild switch $build_limits --refresh --flake 'github:jmalexan/nix/$DEPLOY_REVISION#$DEPLOY_HOST'"

      - name: Verify activation
        env:
          DEPLOY_HOST: ${{ matrix.host }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "deploy@$DEPLOY_HOST" \
            'readlink -f /run/current-system; systemctl is-active sshd.service'
          if [[ "$DEPLOY_HOST" == "nasa" ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 deploy@nasa \
              'set -e; for unit in microapp-approvals.service microapp-notifications.service microapp-notifications-delivery.service updates-dashboard.service git-broker.service agent-boundary.service microvm@robots.service; do systemctl is-active "$unit"; done; sudo robots-health'
          fi

      - name: Return deployment-woken HTPC to sleep
        if: always() && matrix.host == 'htpc' && steps.wake_htpc.outputs.was_asleep == 'true'
        env:
          RESUSPEND_UNIT: github-deploy-resuspend-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 deploy@htpc \
            "sudo systemd-run --unit='$RESUSPEND_UNIT' --on-active=15s --collect /run/current-system/sw/bin/systemctl suspend"
