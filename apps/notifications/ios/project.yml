name: NotificationBridge
options:
  bundleIdPrefix: com.jmalexan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    BRIDGE_BUNDLE_ID: com.jmalexan.NotificationBridge
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NotificationBridge:
    type: application
    platform: iOS
    sources: [Bridge, Shared]
    dependencies:
      - target: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(BRIDGE_PROFILE_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: Generated/Bridge-Info.plist
      properties:
        CFBundleDisplayName: Notifications
        SharedKeychainGroup: $(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: Generated/Bridge.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        keychain-access-groups: [$(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)]
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).NotificationService
        PROVISIONING_PROFILE_SPECIFIER: $(SERVICE_PROFILE_NAME)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Service-Info.plist
      properties:
        CFBundleDisplayName: Notification Service
        SharedKeychainGroup: $(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Generated/Service.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)]
schemes:
  NotificationBridge:
    build:
      targets:
        NotificationBridge: all
    run:
      config: Debug
    archive:
      config: Release
