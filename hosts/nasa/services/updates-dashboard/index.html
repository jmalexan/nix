<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f7fa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#101e30"
    />
    <meta name="color-scheme" content="light dark" />
    <title>System updates</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <app-toolbar heading="System updates"></app-toolbar>

    <main id="content" aria-live="polite">
      <app-empty>Loading…</app-empty>
    </main>

    <dialog class="ui-panel" id="nix-scan-confirm">
      <form method="dialog">
        <h2>Run the Nix scan?</h2>
        <p>This builds both host closures and may take a while.</p>
        <div class="dialog-actions">
          <button class="ui-button" value="cancel" type="submit">Cancel</button>
          <button
            class="ui-button ui-button--primary"
            id="confirm-nix-scan"
            value="confirm"
            type="submit"
          >
            Run scan
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
