<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>System updates</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>System updates</h1>
        <p class="subtitle">nasa</p>
      </div>
    </header>

    <main id="content" aria-live="polite">
      <section class="empty-state"><p>Loading update reports…</p></section>
    </main>

    <dialog id="nix-scan-confirm">
      <form method="dialog">
        <h2>Run the Nix scan?</h2>
        <p>This builds both host closures and may take a while.</p>
        <div class="dialog-actions">
          <button value="cancel" type="submit">Cancel</button>
          <button id="confirm-nix-scan" value="confirm" type="submit">Run scan</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
